[project]
name = "multi-sg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "me.shaunak.roy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pyyaml>=6.0.3",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[project.scripts]
multi-sg = "multi_sg:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu132"

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
